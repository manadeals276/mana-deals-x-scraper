name: Mana Deals X Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: mana-deals-x-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # ================================================
      # Checkout repository
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================================================
      # Setup Python
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================================================
      # Install dependencies
      #
      # IMPORTANT:
      # This is the package used by your OLD
      # working setup.
      # ================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install twifork
          python -m pip install requests

      # ================================================
      # Verify installation
      # ================================================

      - name: Verify X library
        run: |
          python -c "import twikit; print('Twikit module:', twikit.__file__)"

      # ================================================
      # Run X collector
      # ================================================

      - name: Run X collector
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANA_WORKER_URL: ${{ secrets.MANA_WORKER_URL }}
        run: |
          python scrapper.py

      # ================================================
      # Save collector state
      # ================================================

      - name: Save collector state
        run: |
          git config user.name "mana-deals-bot"
          git config user.email "actions@users.noreply.github.com"

          git add seen_posts.json new_deals.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update X collector state"

          git pull --rebase origin main

          git push origin main
