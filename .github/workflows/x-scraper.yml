name: Mana Deals X Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: mana-deals-x-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install twifork

      - name: Run X collector
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANA_WORKER_URL: ${{ secrets.MANA_WORKER_URL }}
        run: |
          python scrapper.py

      - name: Save collector state
        run: |
          git config user.name "mana-deals-bot"
          git config user.email "actions@users.noreply.github.com"

          git add seen_posts.json new_deals.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update X collector state"
            git push
          fi
