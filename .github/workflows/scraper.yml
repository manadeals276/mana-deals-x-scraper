
name: Mana Deals X Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run X collector
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: |
          python scraper.py

      - name: Save seen post IDs
        run: |
          git config user.name "mana-deals-bot"
          git config user.email "actions@users.noreply.github.com"

          git add seen_posts.json new_deals.json

          git diff --cached --quiet || \
            git commit -m "Update X deal collector state"

          git push
