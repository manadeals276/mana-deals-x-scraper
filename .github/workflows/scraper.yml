name: Mana Deals X Collector

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run X collector
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: |
          python scrapper.py

      - name: Save collector state
        run: |
          git config user.name "mana-deals-bot"
          git config user.email "actions@users.noreply.github.com"

          git add seen_posts.json new_deals.json

          if git diff --cached --quiet; then
            echo "No collector state changes to commit."
          else
            git commit -m "Update X collector state"
            git push
          fi
